name: Build Android APK

# Runs on demand, and on every push to main so there is always a fresh APK to
# grab. The finished file lands under the run's "Artifacts" section.
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # AGP 8.x wants a JDK it recognises. The runner's default is newer than
      # the toolchain supports, so pin 21.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - run: npm ci

      - name: Prove the maths before shipping it
        run: npx vitest run

      - name: Build the web app and copy it into the Android project
        run: |
          npx next build
          node scripts/flatten-rsc.mjs out
          npx cap sync android

      # `next start` refuses to run against output:"export", so serve the
      # exported folder the way a static host does (/record -> record.html).
      - name: Measure the accessibility bar on rendered pixels
        run: |
          npx playwright install --with-deps chromium
          node scripts/serve.mjs out 3000 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:3000/ && break; sleep 1; done
          node scripts/a11y.mjs http://localhost:3000

      - name: Assemble the debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: cairn-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
